<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司法订单管理 - BAJIE中后台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Top Bar ===== -->
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-icon">八</div>
      <span>BAJIE 中后台</span>
    </div>
    <nav class="topbar-nav">
      <div class="topbar-nav-item">运营中心</div>
      <div class="topbar-nav-item">数据中心</div>
      <div class="topbar-nav-item active">订单中心</div>
      <div class="topbar-nav-item">审核中心</div>
      <div class="topbar-nav-item">风控中心</div>
      <div class="topbar-nav-item">系统设置</div>
    </nav>
    <div class="topbar-right">
      <span>数据中心</span>
      <div class="topbar-user">
        <div class="topbar-avatar">运</div>
        <span>运营</span>
      </div>
    </div>
  </div>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ===== Main Content ===== -->
  <div class="main-content">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <span>司法管理</span>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current">司法订单</span>
    </div>

    <!-- ===== Filter Card ===== -->
    <div class="filter-card">
      <div class="filter-grid">
        <div class="filter-item">
          <label class="filter-label">订单编号</label>
          <input type="text" class="filter-control" placeholder="请输入订单编号" id="filter-order-id">
        </div>
        <div class="filter-item">
          <label class="filter-label">手机号</label>
          <input type="text" class="filter-control" placeholder="请输入手机号">
        </div>
        <div class="filter-item">
          <label class="filter-label">逾期天数</label>
          <div class="filter-range">
            <input type="text" class="filter-control" placeholder="请输入">
            <span class="filter-range-sep">-</span>
            <input type="text" class="filter-control" placeholder="请输入">
          </div>
        </div>
        <div class="filter-item">
          <label class="filter-label">回款状态</label>
          <select class="filter-control">
            <option>全部</option>
            <option>未回款</option>
            <option>部分回款</option>
            <option>已回款</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="filter-label">司法批次</label>
          <select class="filter-control">
            <option value="">请选择</option>
            <option>2024-07</option>
            <option>2024-08</option>
            <option>2024-09</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="filter-label">司法存证资料</label>
          <select class="filter-control">
            <option>全部</option>
            <option>已存证</option>
            <option>未存证</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="filter-label">商户</label>
          <input type="text" class="filter-control" placeholder="请输入商户名称">
        </div>
        <div class="filter-item">
          <label class="filter-label">订单类型</label>
          <select class="filter-control">
            <option>全部</option>
            <option>融资订单</option>
            <option>租赁订单</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="filter-label">特殊标记</label>
          <input type="text" class="filter-control" placeholder="请输入特殊标记">
        </div>
        <div class="filter-item">
          <label class="filter-label">逾期类型</label>
          <select class="filter-control">
            <option>全部</option>
            <option>账单逾期</option>
            <option>还款逾期</option>
          </select>
        </div>

        <!-- 法院选择（筛选） -->
        <div class="filter-item">
          <label class="filter-label">法院选择</label>
          <select class="filter-control" id="court-select">
            <option value="">请选择</option>
            <option value="北京市人民法院">北京市人民法院</option>
            <option value="上海市人民法院">上海市人民法院</option>
            <option value="广州市人民法院">广州市人民法院</option>
            <option value="深圳市人民法院">深圳市人民法院</option>
            <option value="其他">其他</option>
          </select>
          <div class="court-input-wrapper" id="court-input-wrapper">
            <input type="text" class="filter-control" placeholder="请输入法院名称" id="court-input">
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button class="btn" id="reset-btn">重置</button>
        <button class="btn btn-primary" id="search-btn">
          <span>搜索</span>
        </button>
      </div>
    </div>

    <!-- ===== Status Tabs ===== -->
    <div class="status-tabs" id="status-tabs"></div>

    <!-- ===== Sub Tabs ===== -->
    <div class="sub-tabs" id="sub-tabs"></div>

    <!-- ===== Table ===== -->
    <div class="table-wrapper" id="table-wrapper"></div>

    <!-- Loading -->
    <div class="empty-state" id="loading" style="display: none;">
      <div style="width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #1890ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;"></div>
      <div>加载中...</div>
    </div>
  </div>

  <!-- ===== Status Change Modal ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">状态变更</div>
        <div class="modal-close" id="modal-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn btn-primary" id="modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- ===== Judgment Import Modal ===== -->
  <div class="modal-overlay" id="judgment-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">导入判决金额</div>
        <div class="modal-close" id="judgment-modal-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
      <div class="modal-body" id="judgment-modal-body"></div>
      <div class="modal-footer">
        <button class="btn" id="judgment-modal-cancel">取消</button>
        <button class="btn btn-primary" id="judgment-modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- ===== Order Import Modal ===== -->
  <div class="modal-overlay" id="order-import-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">导入订单</div>
        <div class="modal-close" id="order-import-modal-close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
      <div class="modal-body" id="order-import-modal-body"></div>
      <div class="modal-footer">
        <button class="btn" id="order-import-modal-cancel">取消</button>
        <button class="btn btn-primary" id="order-import-modal-confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
